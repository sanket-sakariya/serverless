name: VNC Desktop
on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install desktop, Chrome, Antigravity, VNC, noVNC, Python, cloudflared
        run: |
          set -e
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal dbus-x11 x11-utils x11-xserver-utils xfonts-base \
            tigervnc-standalone-server tigervnc-common novnc websockify \
            python3 python3-venv python3-pip

          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

          # Antigravity (optional - skip if download fails)
          wget -q -O /tmp/antigravity.deb https://storage.googleapis.com/antigravity-downloads/stable/linux/antigravity_amd64.deb || echo "⚠️ Antigravity download failed, skipping"
          [ -f /tmp/antigravity.deb ] && sudo dpkg -i /tmp/antigravity.deb || true

          wget -q -O /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Create Python venv
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install --upgrade pip

      - name: Start VNC + noVNC
        run: |
          mkdir -p ~/.vnc
          echo "sanket11" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/bash
          export NO_AT_BRIDGE=1
          dbus-launch /usr/bin/startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup
          vncserver :1 -geometry 1920x1080 -depth 24 -localhost no -rfbport 5901
          websockify -D --web=/usr/share/novnc 6080 localhost:5901

      - name: Expose via Cloudflare tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:6080 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { cat /tmp/cf.log; exit 1; }
          echo "============================================================"
          echo "🎉 URL: ${URL}/vnc.html"
          echo "🔑 Password: sanket11"
          echo "============================================================"

      - name: Keep alive
        run: |
          while true; do
            pgrep -f "Xtigervnc.*:1" > /dev/null || vncserver :1 -geometry 1920x1080 -depth 24 -localhost no -rfbport 5901
            sleep 60
          done
